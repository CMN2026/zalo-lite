name: CD - Build and Publish Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: ./backend/api-gateway
            dockerfile: ./backend/api-gateway/Dockerfile
          - service: user-service
            context: ./backend/services/user-service
            dockerfile: ./backend/services/user-service/Dockerfile
          - service: chat-service
            context: ./backend/services/chat-service
            dockerfile: ./backend/services/chat-service/Dockerfile
          - service: chatbot-service
            context: ./backend/services/chatbot-service
            dockerfile: ./backend/services/chatbot-service/Dockerfile
          - service: ai-worker-service
            context: ./backend/services/ai-worker-service
            dockerfile: ./backend/services/ai-worker-service/Dockerfile
          - service: post-service
            context: ./backend/services/post-service
            dockerfile: ./backend/services/post-service/Dockerfile
          - service: web-frontend
            context: ./frontend/web
            dockerfile: ./frontend/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/zalo-lite-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://chat.zalolite.app' }}
            NEXT_PUBLIC_USER_SERVICE_URL=${{ vars.NEXT_PUBLIC_USER_SERVICE_URL || 'https://chat.zalolite.app' }}
            NEXT_PUBLIC_CHAT_SERVICE_URL=${{ vars.NEXT_PUBLIC_CHAT_SERVICE_URL || 'https://chat.zalolite.app' }}
            NEXT_PUBLIC_CHATBOT_SERVICE_URL=${{ vars.NEXT_PUBLIC_CHATBOT_SERVICE_URL || 'https://chat.zalolite.app' }}
            NEXT_PUBLIC_POST_SERVICE_URL=${{ vars.NEXT_PUBLIC_POST_SERVICE_URL || 'https://chat.zalolite.app' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_CHATBOT_STREAMING=${{ vars.NEXT_PUBLIC_CHATBOT_STREAMING || 'false' }}
