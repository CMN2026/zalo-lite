services:
  nginx:
    image: nginx:1.27-alpine
    container_name: zalo-nginx
    restart: unless-stopped
    depends_on:
      web-frontend:
        condition: service_started
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/chat.zalolite.app.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/services/user-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zalo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-user-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${USER_SERVICE_PORT}
      DATABASE_URL: ${USER_SERVICE_DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      RATE_LIMIT_WINDOW_MS: ${USER_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${USER_RATE_LIMIT_MAX}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3001:3001"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-chat-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-chat-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: ${CHAT_SERVICE_PORT}
      REDIS_URL: ${CHAT_SERVICE_REDIS_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USE_S3: ${USE_S3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      USER_SERVICE_BASE_URL: ${CHAT_SERVICE_USER_SERVICE_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${CHAT_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${CHAT_RATE_LIMIT_MAX}
      REDIS_MESSAGE_CHANNEL: ${REDIS_MESSAGE_CHANNEL}
      REDIS_CALL_SIGNAL_CHANNEL: ${REDIS_CALL_SIGNAL_CHANNEL}
      TABLE_CONVERSATIONS: ${TABLE_CONVERSATIONS}
      TABLE_CONVERSATION_MEMBERS: ${TABLE_CONVERSATION_MEMBERS}
      TABLE_MESSAGES: ${TABLE_MESSAGES}
      TABLE_FRIEND_REQUESTS: ${TABLE_FRIEND_REQUESTS}
      TABLE_FRIENDSHIPS: ${TABLE_FRIENDSHIPS}
      TABLE_CALL_SESSIONS: ${TABLE_CALL_SESSIONS}
      TABLE_CALL_HISTORY: ${TABLE_CALL_HISTORY}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CALL_INVITE_TIMEOUT_SECONDS: ${CALL_INVITE_TIMEOUT_SECONDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3002:3002"
    volumes:
      - chat_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  chatbot-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-chatbot-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-chatbot-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${CHATBOT_SERVICE_PORT}
      REDIS_URL: ${CHATBOT_SERVICE_REDIS_URL}
      DATABASE_URL: ${CHATBOT_DATABASE_URL}
      RAG_DATABASE_URL: ${CHATBOT_RAG_DATABASE_URL}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE}
      RAG_MIN_GROUND_SCORE: ${RAG_MIN_GROUND_SCORE}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USER_SERVICE_BASE_URL: ${CHATBOT_USER_SERVICE_BASE_URL}
      CHAT_SERVICE_BASE_URL: ${CHATBOT_CHAT_SERVICE_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${CHATBOT_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${CHATBOT_RATE_LIMIT_MAX}
      TABLE_CONVERSATIONS: ${CHATBOT_TABLE_CONVERSATIONS}
      TABLE_FAQ: ${CHATBOT_TABLE_FAQ}
      TABLE_NOTIFICATIONS: ${CHATBOT_TABLE_NOTIFICATIONS}
      TABLE_ANALYTICS: ${CHATBOT_TABLE_ANALYTICS}
      AUTO_CLOSE_INACTIVE_HOURS: ${AUTO_CLOSE_INACTIVE_HOURS}
      REDIS_NOTIFICATION_CHANNEL: ${REDIS_NOTIFICATION_CHANNEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_AI_ENGINE: ${ENABLE_AI_ENGINE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      AI_PROVIDER_PRIORITY: ${AI_PROVIDER_PRIORITY}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  livekit:
    image: livekit/livekit-server:latest
    container_name: zalo-livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "20000-20100:20000-20100/udp"
    healthcheck:
      test: ["CMD-SHELL", "livekit-server --help > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-worker-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-ai-worker-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-ai-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: ${AI_WORKER_REDIS_URL}
      DATABASE_URL: ${AI_WORKER_DATABASE_URL}
      CHATBOT_SERVICE_URL: ${AI_WORKER_CHATBOT_SERVICE_URL}
      FAQ_INGEST_INTERVAL_MS: ${FAQ_INGEST_INTERVAL_MS}
      ENQUEUE_EMBED_FAQ_ON_STARTUP: ${ENQUEUE_EMBED_FAQ_ON_STARTUP}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL}

  post-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-post-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-post-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${POST_SERVICE_PORT}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USE_S3: ${USE_S3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      USER_SERVICE_BASE_URL: ${POST_SERVICE_USER_SERVICE_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${POST_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${POST_RATE_LIMIT_MAX}
      TABLE_POSTS: ${TABLE_POSTS}
      TABLE_POST_COMMENTS: ${TABLE_POST_COMMENTS}
      TABLE_POST_REACTIONS: ${TABLE_POST_REACTIONS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3005:3005"
    volumes:
      - post_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  api-gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-api-gateway:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-api-gateway
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      chatbot-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${API_GATEWAY_PORT}
      USER_SERVICE_URL: ${API_GATEWAY_USER_SERVICE_URL}
      CHAT_SERVICE_URL: ${API_GATEWAY_CHAT_SERVICE_URL}
      CHATBOT_SERVICE_URL: ${API_GATEWAY_CHATBOT_SERVICE_URL}
      POST_SERVICE_URL: ${API_GATEWAY_POST_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/zalo-lite-web-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zalo-web-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  chat_uploads:
  post_uploads:
