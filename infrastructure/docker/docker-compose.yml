services:
  postgres:
    image: postgres:16-alpine
    container_name: zalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/services/user-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zalo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # dynamodb-local: REMOVED ΓÇö using AWS DynamoDB Cloud

  user-service:
    build:
      context: ../../backend/services/user-service
      dockerfile: Dockerfile
    container_name: zalo-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${USER_SERVICE_PORT}
      DATABASE_URL: ${USER_SERVICE_DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      RATE_LIMIT_WINDOW_MS: ${USER_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${USER_RATE_LIMIT_MAX}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3001:3001"
      - "50051:50051"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat-service:
    build:
      context: ../../backend/services/chat-service
      dockerfile: Dockerfile
    container_name: zalo-chat-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      PORT: ${CHAT_SERVICE_PORT}
      REDIS_URL: ${CHAT_SERVICE_REDIS_URL}
      # DYNAMODB_ENDPOINT: removed — using AWS DynamoDB Cloud
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USE_S3: ${USE_S3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      USER_SERVICE_BASE_URL: ${CHAT_SERVICE_USER_SERVICE_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${CHAT_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${CHAT_RATE_LIMIT_MAX}
      REDIS_MESSAGE_CHANNEL: ${REDIS_MESSAGE_CHANNEL}
      REDIS_CALL_SIGNAL_CHANNEL: ${REDIS_CALL_SIGNAL_CHANNEL}
      TABLE_CONVERSATIONS: ${TABLE_CONVERSATIONS}
      TABLE_CONVERSATION_MEMBERS: ${TABLE_CONVERSATION_MEMBERS}
      TABLE_MESSAGES: ${TABLE_MESSAGES}
      TABLE_FRIEND_REQUESTS: ${TABLE_FRIEND_REQUESTS}
      TABLE_FRIENDSHIPS: ${TABLE_FRIENDSHIPS}
      TABLE_CALL_SESSIONS: ${TABLE_CALL_SESSIONS}
      TABLE_CALL_HISTORY: ${TABLE_CALL_HISTORY}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CALL_INVITE_TIMEOUT_SECONDS: ${CALL_INVITE_TIMEOUT_SECONDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3002:3002"
    volumes:
      - chat_uploads:/app/uploads
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3002/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  chatbot-service:
    build:
      context: ../../backend/services/chatbot-service
      dockerfile: Dockerfile
    container_name: zalo-chatbot-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${CHATBOT_SERVICE_PORT}
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${CHATBOT_SERVICE_REDIS_URL}
      # DYNAMODB_ENDPOINT: removed — using AWS DynamoDB Cloud
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USER_SERVICE_BASE_URL: ${CHATBOT_USER_SERVICE_BASE_URL}
      CHAT_SERVICE_BASE_URL: ${CHATBOT_CHAT_SERVICE_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${CHATBOT_RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${CHATBOT_RATE_LIMIT_MAX}
      TABLE_CONVERSATIONS: ${CHATBOT_TABLE_CONVERSATIONS}
      TABLE_FAQ: ${CHATBOT_TABLE_FAQ}
      TABLE_NOTIFICATIONS: ${CHATBOT_TABLE_NOTIFICATIONS}
      TABLE_ANALYTICS: ${CHATBOT_TABLE_ANALYTICS}
      AUTO_CLOSE_INACTIVE_HOURS: ${AUTO_CLOSE_INACTIVE_HOURS}
      REDIS_NOTIFICATION_CHANNEL: ${REDIS_NOTIFICATION_CHANNEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_AI_ENGINE: ${ENABLE_AI_ENGINE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3003:3003"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3003/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  livekit:
    image: livekit/livekit-server:latest
    container_name: zalo-livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # WebSocket / HTTP API
      - "7880:7880"
      # ICE/TCP fallback for WebRTC
      - "7881:7881"
      # WebRTC media UDP range
      - "20000-20100:20000-20100/udp"
    healthcheck:
      test: [ "CMD-SHELL", "livekit-server --help > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    container_name: zalo-api-gateway
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      chatbot-service:
        condition: service_healthy
    environment:
      PORT: ${API_GATEWAY_PORT}
      USER_SERVICE_URL: ${API_GATEWAY_USER_SERVICE_URL}
      CHAT_SERVICE_URL: ${API_GATEWAY_CHAT_SERVICE_URL}
      CHATBOT_SERVICE_URL: ${API_GATEWAY_CHATBOT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3004:3004"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3004/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  chat_uploads:

